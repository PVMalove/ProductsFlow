name: CI

on:
  pull_request:
  push:
    branches: [feature/microservices]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect affected backend packages
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.matrix.outputs.members }}
      services: ${{ steps.matrix.outputs.services }}
      has_backend_changes: ${{ steps.matrix.outputs.has_backend_changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            changed:
              - '**'

      - id: matrix
        name: Expand dependency graph
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.changed_files }}
        run: python backend/scripts/ci_matrix.py --github-output "$GITHUB_OUTPUT"

  backend-architecture:
    name: Architecture boundaries
    needs: changes
    if: needs.changes.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: python scripts/check_architecture.py --strict
      - run: uv run --project services/identity-service pytest tests/unit/test_architecture_check.py tests/unit/test_ci_matrix.py -q

  backend-lint:
    name: Lint (${{ matrix.member }})
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.changes.outputs.members) }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: make check pkg=${{ matrix.member }}

  backend-test:
    name: Test (${{ matrix.member }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.changes.outputs.members) }}
    env:
      PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/backend/test-results.xml
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: make test pkg=${{ matrix.member }}

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (${{ matrix.member }})
          path: backend/test-results.xml
          reporter: python-xunit
          fail-on-error: 'true'

      - name: Upload test results artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.member }}
          path: backend/test-results.xml

  backend-build:
    name: Build (${{ matrix.service }})
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - run: docker build --file services/${{ matrix.service }}/Dockerfile --tag productsflow/${{ matrix.service }}:ci .
