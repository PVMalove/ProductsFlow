name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read # нужно для checkout

jobs:
  backend-lint:
    name: Lint (${{ matrix.member }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        member:
          - kernel-domain
          - kernel-platform
          - test-support
          - identity-service
          - catalog-service
          - support-service
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: make check pkg=${{ matrix.member }}

  backend-test:
    name: Test (${{ matrix.member }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        member:
          - identity-service
          - kernel-platform
          - kernel-domain
          - test-support
          - catalog-service
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: make test pkg=${{ matrix.member }}

  backend-build:
    name: Build API images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - run: docker compose build
