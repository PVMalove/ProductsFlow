name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --explicit-package-bases app

  test:
    runs-on: ubuntu-latest
    # app/db.py строит движок из settings.database_url при импорте модуля,
    # а app/security.py подписывает JWT settings.secret_key — обе нужны
    # ещё до того, как testcontainers поднимет собственный Postgres для
    # самих тестов, поэтому значения ниже никогда реально не используются.
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      SECRET_KEY: ci-only-placeholder-secret-key-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      # Postgres не поднимается отдельным services-блоком: testcontainers
      # сам стартует и гасит контейнер на Docker-демоне раннера.
      - run: uv run pytest
