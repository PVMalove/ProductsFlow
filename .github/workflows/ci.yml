name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read # нужно для checkout

jobs:
  backend-architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: python scripts/check_architecture.py --strict
      - run: uv run --project services/identity-service pytest tests/unit/test_architecture_check.py -q

  backend-lint:
    name: Lint (${{ matrix.member }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        member:
          - kernel-domain
          - kernel-platform
          - test-support
          - identity-service
          - catalog-service
          - support-service
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: make check pkg=${{ matrix.member }}

  backend-test:
    name: Test (${{ matrix.member }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        member:
          - identity-service
          - kernel-platform
          - kernel-domain
          - test-support
          - catalog-service
    env:
      PYTEST_ADDOPTS: --junitxml=test-results.xml
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: make test pkg=${{ matrix.member }}

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: always() # выполняется всегда, чтобы отчёт был виден и при падении тестов
        with:
          name: Test Results (${{ matrix.member }})
          path: backend/test-results.xml
          reporter: python-xunit # формат отчёта, который генерирует pytest --junitxml
          fail-on-error: 'true'

      - name: Upload test results artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.member }}
          path: backend/test-results.xml

  backend-build:
    name: Build API images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - run: docker compose build
