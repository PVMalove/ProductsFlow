name: productsflow-backend

services:
  identity-api:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: identity-api
    environment:
      APP_ENV: ${APP_ENV}
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL}
      IDENTITY_JWT_PRIVATE_KEY_PATH: ${IDENTITY_JWT_PRIVATE_KEY_PATH}
      IDENTITY_ACCESS_TOKEN_TTL_HOURS: ${IDENTITY_ACCESS_TOKEN_TTL_HOURS}
    networks:
      - backend-network

  identity-worker:
    # Outbox Publisher (ADR 0014, issue #100) — вторая точка входа
    # identity-service, не HTTP-процесс (ADR 0010: тот же образ, другой
    # CMD). Никогда не делит процесс с identity-api: краш/рестарт паблишера
    # не задевает обработку запросов.
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: identity-worker
    command: ["python", "-m", "api.worker"]
    environment:
      APP_ENV: ${APP_ENV}
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL}
      IDENTITY_AMQP_URL: ${IDENTITY_AMQP_URL}
    networks:
      - backend-network

  catalog-api:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: catalog-api
    environment:
      APP_ENV: ${APP_ENV}
      CATALOG_DATABASE_URL: ${CATALOG_DATABASE_URL}
      CATALOG_IDENTITY_BASE_URL: ${CATALOG_IDENTITY_BASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9002}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret-key}
      MINIO_BUCKET_NAME_PRODUCT: ${MINIO_BUCKET_NAME_PRODUCT:-product-chunks}
      MINIO_BUCKET_NAME_LOKI: ${MINIO_BUCKET_NAME_LOKI:-loki-chunks}
      MINIO_BUCKET_NAME_TEMPO: ${MINIO_BUCKET_NAME_TEMPO:-tempo-traces}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend-network

  catalog-worker:
    # User-event projection worker (ADR 0010/0019) — тот же образ catalog,
    # отдельный процесс и CMD, что и catalog-api.
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: catalog-worker
    command: ["python", "-m", "api.worker"]
    environment:
      APP_ENV: ${APP_ENV}
      CATALOG_DATABASE_URL: ${CATALOG_DATABASE_URL}
      CATALOG_AMQP_URL: ${CATALOG_AMQP_URL}
    networks:
      - backend-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret-key}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-network

  support-api:
    build:
      context: .
      dockerfile: services/support-service/Dockerfile
    container_name: support-api
    environment:
      APP_ENV: ${APP_ENV}
      SUPPORT_DATABASE_URL: ${SUPPORT_DATABASE_URL}
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  minio_data:
