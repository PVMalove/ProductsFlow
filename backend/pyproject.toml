[project]
name = "backend"
version = "0.1.0"
description = "ProductsFlow backend — корень uv workspace (ADR 0010)"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/libs/*", "src/services/*"]

[tool.uv.sources]
identity-service = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py314"
# Автосгенерированные alembic-ревизии не проходят через линт/форматтер.
# whitelist.py — файл-whitelist для vulture, а не исполняемый/типизируемый код.
extend-exclude = ["*/alembic/versions", "whitelist.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    # Только для identity-service: async-драйвер Postgres-фикстуры (issue #99,
    # см. testcontainers ниже).
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    # Только для kernel-platform: сквозной round-trip тест JWKS (ADR 0011)
    # верифицирует токен через настоящий код и настоящий эндпоинт identity —
    # без своей группы зависимостей у kernel-platform она бы не merge'илась
    # с этой (per-package dependency-groups в uv workspace переопределяют,
    # а не дополняют друг друга), поэтому declaration только здесь.
    "identity-service",
    "mypy>=2.3.1",
    # Только для identity-service: RabbitMQ smoke-фикстура (issue #99) вызывает
    # pika напрямую (объявляет/чистит тестовую очередь) — так же тянется
    # транзитивно testcontainers[rabbitmq]'s own readiness probe, но прямое
    # использование заслуживает собственной строки, а не скрытой транзитивности.
    "pika>=1.4.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.1",
    # Только для identity-service: session/savepoint-обвязка Postgres-фикстуры
    # (issue #99), тот же приём, что db_session в tests/conftest.py монолита.
    "sqlalchemy[asyncio]>=2.0",
    # Только для identity-service: заглушечные Postgres+RabbitMQ
    # testcontainers-фикстуры (issue #99) взамен ещё не существующего
    # libs/test-support (ADR 0018) — те же ограничения на merge dev-групп,
    # что и у httpx выше.
    "testcontainers[postgres,rabbitmq]>=4.15.0",
    "vulture>=2.14",
]

[tool.mypy]
exclude = ["^whitelist\\.py$"]

[[tool.mypy.overrides]]
# pika (RabbitMQ smoke-test fixture, issue #99) ships no stubs/py.typed —
# same treatment monolith's root pyproject.toml gives aioboto3.
module = ["pika.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# asyncpg (OutboxListener's dedicated LISTEN connection, ADR 0014/issue #102)
# ships no stubs/py.typed either — same treatment as pika above.
module = ["asyncpg.*"]
ignore_missing_imports = true

# Секция обязательна: без неё pytest не считает backend/pyproject.toml
# конфиг-файлом и продолжает подниматься вверх по дереву каталогов, пока не
# найдёт корневой pyproject.toml монолита — и подхватывает его pytest-настройки
# (testpaths/asyncio_mode), которые к backend/ не относятся.
# asyncio_mode = "auto" — общий для всех членов workspace: async def test_*
# запускаются сами, без ручных @pytest.mark.asyncio на каждом (kernel-platform,
# ADR 0011 round-trip тест).
[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.vulture]
exclude = [
    ".venv/",
    "*/alembic/versions/",
]
min_confidence = 80
