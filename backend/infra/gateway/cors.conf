# Shared CORS handling for browser-facing API locations. $cors_origin (see
# the map in nginx.conf) is only non-empty for allowlisted origins, so
# unlisted cross-origin callers get no Access-Control-Allow-Origin header
# and are blocked by the browser, same as before this file existed.
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Credentials true always;
add_header Vary Origin always;

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Vary Origin always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}
