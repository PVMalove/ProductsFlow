worker_processes auto;
events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/json;

    upstream identity_api {
        server identity-api:8000;
    }

    upstream catalog_api {
        server catalog-api:8000;
    }

    upstream support_api {
        server support-api:8000;
    }

    upstream inventory_api {
        server inventory-api:8000;
    }

    upstream minio {
        server minio:9000;
    }

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=write_limit:10m rate=2r/s;

    # An empty key means limit_req skips counting for that zone entirely,
    # so each request only counts against the zone matching its method.
    map $request_method $products_write_key {
        default "";
        POST $binary_remote_addr;
        PATCH $binary_remote_addr;
        DELETE $binary_remote_addr;
    }

    map $request_method $products_read_key {
        default $binary_remote_addr;
        POST "";
        PATCH "";
        DELETE "";
    }

    # DEFAULT_PAGE_LIMIT (kernel_platform/pagination.py) is 20, and the
    # catalog UI fetches each product's image via its own request, so one
    # catalog page alone costs 21 read requests (1 search + 20 images) — the
    # old rate=20r/s burst=20 left no room even for a single page load.
    limit_req_zone $products_read_key zone=products_read_limit:10m rate=60r/s;
    limit_req_zone $products_write_key zone=products_write_limit:10m rate=2r/s;

    # Fall back to nginx's own $request_id when the client didn't send one,
    # so the edge and the app log the same correlation id (see ADR 0004).
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        "" $request_id;
    }

    # CORS origin allowlist: reflect $http_origin only for known frontend
    # origins (see cors.conf), everything else gets no CORS header at all.
    # Add the prod frontend origin here once it's known.
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
    }

    server {
        listen 80;
        server_name localhost;

        limit_req_status 429;
        error_page 429 = @ratelimited;

        # Anti-spoofing: zero out any client-supplied identity headers before
        # proxying. No service reads these today, this is defense in depth
        # per ADR 0004, not a behavior change for any existing caller.
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-Request-ID $req_id;

        location @ratelimited {
            include cors.conf;
            # Shared across all zones (per spec), so use auth_limit's ~6s window
            # (60s / 10r/m), the strictest of the zones this location serves.
            add_header Retry-After 6 always;
            return 429 '{"error": {"code": "TOO_MANY_REQUESTS", "message": "Too many requests. Please try again later."}}';
        }

        location = /healthz {
            return 200;
        }

        # ----------------------------------------------------
        # Identity Service Routes
        # ----------------------------------------------------
        location = /.well-known/jwks.json {
            proxy_pass http://identity_api;
        }

        location = /api/v1/auth {
            include cors.conf;
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://identity_api;
        }

        location ^~ /api/v1/auth/ {
            include cors.conf;
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://identity_api;
        }

        location = /api/v1/users {
            include cors.conf;
            limit_req zone=write_limit burst=20 nodelay;
            proxy_pass http://identity_api;
        }

        location ^~ /api/v1/users/ {
            include cors.conf;
            limit_req zone=write_limit burst=20 nodelay;
            proxy_pass http://identity_api;
        }

        # ----------------------------------------------------
        # Catalog Service Routes
        # ----------------------------------------------------
        location = /api/v1/products {
            include cors.conf;
            limit_req zone=products_read_limit burst=60 nodelay;
            limit_req zone=products_write_limit burst=20 nodelay;
            proxy_pass http://catalog_api;
        }

        location ^~ /api/v1/products/ {
            include cors.conf;
            limit_req zone=products_read_limit burst=60 nodelay;
            limit_req zone=products_write_limit burst=20 nodelay;
            proxy_pass http://catalog_api;
        }

        # Presigned product-image URLs are converted by the frontend to this
        # same-origin path so browsers access object storage only through the
        # Gateway. The configured public endpoint is the Gateway itself, so
        # its Host value is preserved for the MinIO SigV4 verification.
        location ^~ /media/ {
            proxy_set_header Host gateway;
            proxy_pass http://minio/;
        }

        # ----------------------------------------------------
        # Support Service Routes
        # ----------------------------------------------------
        location = /api/v1/tickets {
            include cors.conf;
            limit_req zone=write_limit burst=20 nodelay;
            proxy_pass http://support_api;
        }

        location ^~ /api/v1/tickets/ {
            include cors.conf;
            limit_req zone=write_limit burst=20 nodelay;
            proxy_pass http://support_api;
        }

        # ----------------------------------------------------
        # Inventory Service Routes
        # ----------------------------------------------------
        # Admin-only audited stock adjustment (issue #367) — write-shaped,
        # same rate-limit zone as products/tickets writes.
        location ^~ /api/v1/inventory/ {
            include cors.conf;
            limit_req zone=write_limit burst=20 nodelay;
            proxy_pass http://inventory_api;
        }

        # Catch-all for undefined routes
        location / {
            return 404 '{"error": {"code": "NOT_FOUND", "message": "Endpoint not found"}}';
        }
    }
}
