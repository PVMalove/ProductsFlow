# Однонодовый Loki (issue #328), хранилище чанков — существующий MinIO
# (bucket MINIO_BUCKET_NAME_LOKI, создаётся monitoring-minio-init до старта
# этого сервиса). Локально на диске остаётся только TSDB-индекс.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki
  storage:
    s3:
      endpoint: minio:9000
      region: us-east-1
      bucketnames: ${MINIO_BUCKET_NAME_LOKI}
      access_key_id: ${MINIO_ROOT_USER}
      secret_access_key: ${MINIO_ROOT_PASSWORD}
      insecure: true
      s3forcepathstyle: true

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

limits_config:
  metric_aggregation_enabled: false
