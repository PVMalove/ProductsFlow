# Собирает логи ВСЕХ контейнеров текущего Compose-проекта через Docker API
# (issue #328). Namespace-фильтр по com.docker.compose.project — ставится
# Docker Compose на каждый контейнер автоматически, изолирует от логов
# несвязанных стеков на той же машине. trace_id для перехода в Tempo
# достаётся из сырой JSON-строки лога derived field'ом на стороне Grafana
# (см. grafana/provisioning/datasources/datasources.yml) — не лейблом,
# чтобы не поднимать кардинальность (ADR 0015).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: compose
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values:
              - com.docker.compose.project=${COMPOSE_PROJECT_NAME}
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "compose_service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "compose_project"
