global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: identity-service
    static_configs:
      - targets: ["identity-api:8000"]

  - job_name: catalog-service
    static_configs:
      - targets: ["catalog-api:8000"]

  # Этот worker открывает внутренний prometheus_client HTTP server; порт не
  # публикуется хосту, он доступен только Prometheus в backend-network.
  - job_name: catalog-search-worker
    static_configs:
      - targets: ["catalog-search-worker:9100"]

  - job_name: support-service
    static_configs:
      - targets: ["support-api:8000"]
