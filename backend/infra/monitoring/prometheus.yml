global:
  scrape_interval: 15s

scrape_configs:
  - job_name: identity-service
    static_configs:
      - targets: ["identity-api:8000"]

  - job_name: catalog-service
    static_configs:
      - targets: ["catalog-api:8000"]

  - job_name: support-service
    static_configs:
      - targets: ["support-api:8000"]
