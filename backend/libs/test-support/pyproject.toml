[project]
name = "test-support"
version = "0.1.0"
description = "Общие testcontainers-фикстуры (Postgres, RabbitMQ) для интеграционных тестов сервисов backend/ ."
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "asyncpg>=0.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_support"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.1",
    "vulture>=2.14",
]

# Общий [tool.ruff]/[tool.mypy]-конфиг живёт в корневом backend/pyproject.toml
#  — этот пакет наследует его через extend, а не дублирует.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
exclude = ["^whitelist\\.py$"]

[[tool.mypy.overrides]]
# asyncpg ships no stubs/py.typed — same treatment as identity-service/
# kernel-platform give it.
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.vulture]
exclude = [".venv/"]
min_confidence = 80
