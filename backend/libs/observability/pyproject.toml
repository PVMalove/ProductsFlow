[project]
name = "observability"
version = "0.1.0"
description = "Логирование/request-context ProductsFlow (formatters/ContextVar/RequestContextMiddleware) — выделено из kernel-platform ."
requires-python = ">=3.14"
dependencies = [
    # RequestContextMiddleware  — ASGI-примитив, не завязан на
    # fastapi целиком.
    "starlette>=1.6.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]

[dependency-groups]
dev = [
    # In-memory async engine for db_metrics tests only — pure Python, no
    # native build, unlike the real drivers (asyncpg/psycopg) services use.
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.1",
    "vulture>=2.14",
]

# Общий [tool.ruff]/[tool.mypy]-конфиг живёт в корневом backend/pyproject.toml
#  — этот пакет наследует его через extend, а не дублирует.
[tool.ruff]
extend = "../../pyproject.toml"

# whitelist.py — файл-whitelist для vulture, а не исполняемый/типизируемый код.
extend-exclude = ["whitelist.py"]

[tool.mypy]
exclude = ["^whitelist\\.py$"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.vulture]
exclude = [".venv/"]
min_confidence = 80
