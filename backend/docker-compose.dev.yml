services:
  identity-api:
    environment:
      APP_ENV: dev
    ports:
      - "9010:8000"

  identity-worker:
    environment:
      APP_ENV: dev

  identity-bootstrap:
    environment:
      SKIP_SEED: "true"

  catalog-bootstrap:
    environment:
      SKIP_SEED: "true"

  catalog-api:
    environment:
      APP_ENV: dev
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9002
    ports:
      - "9011:8000"

  support-api:
    environment:
      APP_ENV: dev
    ports:
      - "9012:8000"

  minio:
    ports:
      - "9002:9000"
      - "9003:9001"

  identity-db:
    ports:
      - "5441:5432"

  catalog-db:
    ports:
      - "5442:5432"

  support-db:
    ports:
      - "5443:5432"
