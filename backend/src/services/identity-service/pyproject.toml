[project]
name = "identity-service"
version = "0.1.0"
description = "identity-service (TD-01, Фазы 1-2) — пустой каркас, наполняется начиная с Фазы 1."
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
