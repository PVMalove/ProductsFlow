[project]
name = "identity-service"
version = "0.1.0"
description = "identity-service (TD-01, Фазы 1-2) — пустой каркас, наполняется начиная с Фазы 1."
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "kernel-platform",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.uv.sources]
kernel-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
