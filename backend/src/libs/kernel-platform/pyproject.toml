[project]
name = "kernel-platform"
version = "0.1.0"
description = "Инфраструктурные примитивы ProductsFlow (IdentityClient/Outbox-Inbox/bootstrap) — httpx/SQLAlchemy/OTEL допустимы (ADR 0013)."
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_platform"]
