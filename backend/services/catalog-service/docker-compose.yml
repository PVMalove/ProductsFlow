services:
  catalog-api:
    build:
      context: ../..
      dockerfile: services/catalog-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-dev}
      CATALOG_DATABASE_URL: ${CATALOG_DATABASE_URL:-}
      CATALOG_IDENTITY_BASE_URL: ${CATALOG_IDENTITY_BASE_URL:-http://identity-api:8000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9002}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret-key}
      MINIO_BUCKET_NAME_PRODUCT: ${MINIO_BUCKET_NAME_PRODUCT:-product-chunks}
      MINIO_BUCKET_NAME_LOKI: ${MINIO_BUCKET_NAME_LOKI:-loki-chunks}
      MINIO_BUCKET_NAME_TEMPO: ${MINIO_BUCKET_NAME_TEMPO:-tempo-traces}
    depends_on:
      minio:
        condition: service_healthy

  catalog-worker:
    build:
      context: ../..
      dockerfile: services/catalog-service/Dockerfile
    command: ["python", "-m", "presentation.worker"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      CATALOG_DATABASE_URL: ${CATALOG_DATABASE_URL:-}
      CATALOG_AMQP_URL: ${CATALOG_AMQP_URL:-amqp://guest:guest@localhost:5672/}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret-key}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio_data:
