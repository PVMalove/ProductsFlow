[project]
name = "identity-service"
version = "0.1.0"
description = "identity-service — RS256-подпись/верификация токенов, JWKS, outbox-воркер (ADR 0011/0014/0020)."
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "kernel-domain",
    "kernel-platform",
    "observability",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.35.0",
]

[tool.uv.sources]
kernel-domain = { workspace = true }
kernel-platform = { workspace = true }
observability = { workspace = true }


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    # RabbitMQ smoke-фикстура (issue #99) вызывает pika напрямую (объявляет/
    # чистит тестовую очередь).
    "pika>=1.4.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.1",
    # Заглушечные Postgres+RabbitMQ testcontainers-фикстуры (issue #99) взамен
    # ещё не существующего libs/test-support (ADR 0018).
    "testcontainers[postgres,rabbitmq]>=4.15.0",
    "vulture>=2.14",
]

# Общий [tool.ruff]/[tool.mypy]-конфиг живёт в корневом backend/pyproject.toml
# (ADR 0020) — этот пакет наследует его через extend, а не дублирует.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
mypy_path = ["src"]
exclude = ["^whitelist\\.py$"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pika.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.vulture]
exclude = [".venv/", "*/alembic/versions/"]
min_confidence = 80
