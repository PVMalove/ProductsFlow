[project]
name = "identity-service"
version = "0.1.0"
description = "identity-service — RS256-подпись/верификация токенов, JWKS, outbox-воркер (ADR 0011/0014/0020)."
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "kernel-platform",
    "observability",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0",
]

# path-зависимости на соседние пакеты монорепо (ADR 0020) — editable в
# dev-окружении, --no-editable при сборке production-образа (см. Dockerfile).
[tool.uv.sources]
kernel-platform = { path = "../../libs/kernel-platform", editable = true }
observability = { path = "../../libs/observability", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    # RabbitMQ smoke-фикстура (issue #99) вызывает pika напрямую (объявляет/
    # чистит тестовую очередь).
    "pika>=1.4.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.1",
    # Заглушечные Postgres+RabbitMQ testcontainers-фикстуры (issue #99) взамен
    # ещё не существующего libs/test-support (ADR 0018).
    "testcontainers[postgres,rabbitmq]>=4.15.0",
    "vulture>=2.14",
]

# Общий [tool.ruff]/[tool.mypy]-конфиг живёт в корневом backend/pyproject.toml
# (ADR 0020) — этот пакет наследует его через extend, а не дублирует.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
exclude = ["^whitelist\\.py$"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pika.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.vulture]
exclude = [".venv/", "*/alembic/versions/"]
min_confidence = 80
