[project]
name = "productsflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.0",
    "faker>=40.37.0",
    "fastapi>=0.141.1",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "starlette>=1.4.1",
    "uvicorn>=0.52.1",
]
[tool.ruff]
line-length = 88
target-version = "py314"
# Автосгенерированные alembic-ревизии не проходят через линт/форматтер.
# whitelist.py — файл-whitelist для vulture, а не исполняемый/типизируемый код.
extend-exclude = ["alembic/versions", "whitelist.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "testcontainers[postgres]>=4.15.0",
    "vulture>=2.14",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.mypy]
exclude = ["^whitelist\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.vulture]
exclude = [
    ".venv/",
    "alembic/versions/",
    ".git/",
    ".idea/",
    ".claude/",
    ".agents/",
    "docs/",
    "__pycache__/",
    ".mypy_cache/",
    ".ruff_cache/",
    ".pytest_cache/",
]
min_confidence = 80
